[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- SETTING HARDWARE N16R8 ---
board_build.arduino.memory_type = dio_opi
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.psram_type = opi
board_upload.flash_size = 16MB

; --- OMEGA BYPASS FLAGS (WAJIB BUAT DEAUTH) ---
build_flags = 
    -DCONFIG_ESP_WIFI_MGMT_S3_RETRY=y
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_SPIRAM_SUPPORT=1
    -DCONFIG_SPIRAM_MODE_OPI=1
    -DCONFIG_ESP_WIFI_SOFTAP_SUPPORT=y
    -DCONFIG_ESP_WIFI_PROMISCUOUS_SUPPORT=y
    -DCONFIG_ESP_WIFI_80211_TX=y
    -DCONFIG_ESP_WIFI_80211_TX_BYPASS=y
    -O3

; --- DAFTAR LIBRARY (INI YANG LU MINTA) ---
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.15.0
    Wire
    SPI
