name: RootX Firmware Build

on:
  push:
    branches: [ "main" ] # Jalankan setiap kali lu push ke branch main
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Biar lu bisa klik tombol "Run" manual di GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build Firmware
        run: pio run -e esp32-s3-n16r8
        # Ini bakal baca platformio.ini lu yang ada flag bypass deauth-nya

      - name: Upload Firmware Binary
        uses: actions/upload-artifact@v4
        with:
          name: RootX-Firmware-S3-N16R8
          path: .pio/build/esp32-s3-n16r8/firmware.bin
